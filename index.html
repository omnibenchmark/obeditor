function markErrorLine(lineNumber) {
  clearErrorLine();
  if (!lineNumber || !yamlModel) return;
  errorDecorations = yamlModel.deltaDecorations([], [{
    range: new monaco.Range(lineNumber, 1, lineNumber, 1),
    options: {
      glyphMarginClassName: "error-glyph",
      isWholeLine: true,
      className: "error-line-bg",
    },
  }]);
}

function clearErrorLine() {
  if (errorDecorations && yamlModel) { yamlModel.deltaDecorations(errorDecorations, []); errorDecorations = null; }
}

function setStatus(cls, msg) {
  const bar = document.getElementById("status-bar");
  bar.className = cls;
  document.getElementById("status-msg").textContent = msg;
}

// ── Mermaid setup ────────────────────────────────────────────────────────────
mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose" });
let _mermaidCounter = 0;
let _mermaidLinks = {};

// Called by mermaid `click` directives. Resolves the node id to a repo URL and
// opens it. URLs come from the benchmark YAML, so only allow http(s).
window.obModuleClick = function (nid) {
  const url = _mermaidLinks[nid];
  if (url && /^https?:\/\//i.test(url)) window.open(url, "_blank", "noopener");
};

async function renderMermaid(source) {
  const viewport = document.getElementById("mermaid-viewport");
  viewport.innerHTML = "";
  try {
    const id = "mermaid-" + (++_mermaidCounter);
    const { svg, bindFunctions } = await mermaid.render(id, source);
    viewport.innerHTML = svg;
    if (bindFunctions) bindFunctions(viewport);
    resetMermaidView();
  } catch (e) {
    viewport.textContent = "Diagram error: " + e.message;
  }
}

// ── Mermaid pan/zoom ──────────────────────────────────────────────────────────
const _mmView = { scale: 1, x: 0, y: 0 };

function _applyMermaidTransform() {
  const vp = document.getElementById("mermaid-viewport");
  vp.style.transform =
    `translate(${_mmView.x}px, ${_mmView.y}px) scale(${_mmView.scale})`;
}

function resetMermaidView() {
  _mmView.scale = 1; _mmView.x = 0; _mmView.y = 0;
  _applyMermaidTransform();
}

function _zoomMermaid(factor, cx, cy) {
  const next = Math.min(8, Math.max(0.2, _mmView.scale * factor));
  const ratio = next / _mmView.scale;
  // keep the point under (cx, cy) fixed while zooming
  _mmView.x = cx - (cx - _mmView.x) * ratio;
  _mmView.y = cy - (cy - _mmView.y) * ratio;
  _mmView.scale = next;
  _applyMermaidTransform();
}

(function initMermaidPanZoom() {
  const container = document.getElementById("mermaid-container");
  if (!container) return;

  container.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    _zoomMermaid(e.deltaY < 0 ? 1.12 : 1 / 1.12,
                 e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });

  // Pan with a movement threshold so plain clicks still reach node links.
  let down = false, moved = false, startX = 0, startY = 0, lastX = 0, lastY = 0;
  const DRAG_THRESHOLD = 4;

  container.addEventListener("pointerdown", (e) => {
    if (e.target.closest("#mermaid-controls")) return;
    if (e.button !== 0) return;
    down = true; moved = false;
    startX = lastX = e.clientX; startY = lastY = e.clientY;
  });
  window.addEventListener("pointermove", (e) => {
    if (!down) return;
    if (!moved &&
        Math.hypot(e.clientX - startX, e.clientY - startY) > DRAG_THRESHOLD) {
      moved = true;
      container.classList.add("panning");
    }
    if (!moved) return;
    _mmView.x += e.clientX - lastX;
    _mmView.y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    _applyMermaidTransform();
  });
  window.addEventListener("pointerup", () => {
    down = false;
    container.classList.remove("panning");
  });
  // Suppress the click that follows a drag so it doesn't open a repo link.
  container.addEventListener("click", (e) => {
    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);

  document.getElementById("mermaid-controls").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const rect = container.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    if (btn.dataset.zoom === "in")   _zoomMermaid(1.25, cx, cy);
    else if (btn.dataset.zoom === "out") _zoomMermaid(1 / 1.25, cx, cy);
    else if (btn.dataset.zoom === "fullscreen") {
      if (document.fullscreenElement) document.exitFullscreen();
      else container.requestFullscreen();
    }
    else resetMermaidView();
  });
})();

function renderStats(statsJson) {
  if (!statsJson) return;
  const stats = JSON.parse(statsJson);
  const grid = document.getElementById("stats-grid");
  grid.innerHTML = "";
  const addChip = (val, lbl) => {
    const chip = document.createElement("div");
    chip.className = "stat-chip";
    chip.innerHTML = `<div class="val">${val}</div><div class="lbl">${lbl}</div>`;
    grid.appendChild(chip);
  };
  addChip(stats.stages, "stages");
  addChip(stats.modules, "modules");
  if (stats.total != null) addChip(stats.total.toLocaleString(), "total rules");
  for (const [sid, cnt] of Object.entries(stats.by_stage || {})) {
    addChip(cnt, sid);
  }
  document.getElementById("stats-section").style.display = "";
}

function renderCheck(ok, errMsg, statsJson, mermaidSrc, ioSummaryJson, mermaidLinks) {
  const badge = document.getElementById("check-badge");
  const icon  = document.getElementById("check-icon");
  const msg   = document.getElementById("check-msg");
  if (ok) {
    badge.className = "check-badge ok";
    icon.textContent  = "✓";
    msg.textContent   = "Validation passed" + (filterOn() ? " · filtered view" : "");
  } else {
    badge.className = "check-badge error";
    icon.textContent  = "✗";
    msg.textContent   = (errMsg || "Validation failed").split("\n")[0];
  }
  if (ok && statsJson) renderStats(statsJson);
  if (ok && mermaidSrc) {
    document.getElementById("mermaid-section").style.display = "";
    try { _mermaidLinks = mermaidLinks ? JSON.parse(mermaidLinks) : {}; }
    catch { _mermaidLinks = {}; }
    renderMermaid(mermaidSrc);
  }
  if (ok && ioSummaryJson) renderIoSummary(ioSummaryJson);
}

// Clear stale renders (graph, snakefile, io) when loading a fresh benchmark so
// the old one doesn't linger while the new conversion runs.
function blankViews() {
  const vp = document.getElementById("mermaid-viewport");
  if (vp) vp.innerHTML = "";
  document.getElementById("mermaid-section").style.display = "none";
  document.getElementById("io-section").style.display = "none";
  if (typeof snakeModel !== "undefined" && snakeModel) snakeModel.setValue("");
  if (typeof runnerModel !== "undefined" && runnerModel) runnerModel.setValue("");
  snakefileFresh = false;
  lastIoSummary = null;
}

function renderIoSummary(ioSummaryJson) {
  const rows = JSON.parse(ioSummaryJson);
  const tbody = document.querySelector("#io-table tbody");
  tbody.innerHTML = "";
  for (const row of rows) {
    const ins  = row.inputs.length  ? row.inputs.join(", ")  : '<span class="none">—</span>';
    const outs = row.outputs.length ? row.outputs.join(", ") : '<span class="none">—</span>';
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${row.stage}</td><td>${ins}</td><td>${outs}</td>`;
    tbody.appendChild(tr);
  }
  document.getElementById("io-section").style.display = "";
}

// ── Filter: a lens over the right-hand views ─────────────────────────────────
// The parent stays in the editor; applying picks makes Check / Snakefile / run.sh /
// Filtered describe the pruned benchmark. Picks come from the Filter tab on the
// left: hand-written YAML, a preset from the repo, or a pasted .obfilter blob.

function updateBenchData(stagesJson, parentHash, parentUrl) {
  if (typeof stagesJson === "undefined") {
    console.warn("updateBenchData: worker did not send 'wizard' field — likely a stale worker.js cache. Hard-reload the page (Ctrl+Shift+R).");
  }
  benchStages = stagesJson ? JSON.parse(stagesJson) : [];
  benchParentHash = parentHash || null;
  // Keep the untouched template in step with the benchmark (new stages show up).
  if (filterModel && filterAutoText !== null && filterModel.getValue() === filterAutoText) {
    filterAutoText = defaultFilterText();
    filterModel.setValue(filterAutoText);
  }
  // The result is stale once the parent text changes; regenerate while a filter is applied.
  if (filterResult && filterResult.parent_hash !== benchParentHash) filterResult = null;
  if (filterOn() && !filterResult && benchStages.length) runFilter();
  refreshFilterStatus();
  if (activeTab === "filter") renderFilterResult();
}

function filterOn() { return !!(activePicks || activeUntil); }

function runFilter() {
  if (!pyodideReady || !filterOn()) return;
  worker.postMessage({ type: "filter", yaml: yamlModel.getValue(), picks: activePicks, until: activeUntil, derivedFrom: loadedSourceUrl });
}

function setActivePicks(picks, until = null) {
  activePicks = picks;
  activeUntil = until;
  filterResult = null;
  document.getElementById("filter-dot").style.display = filterOn() ? "" : "none";
  document.getElementById("view-filter-pill").classList.toggle("on", filterOn());
  snakefileFresh = false;
  scheduleConvert(0);           // re-derive every view through the lens (or without it)
  refreshFilterStatus();
  if (activeTab === "filter") renderFilterResult();
}

function setLeftTab(tab) {
  activeLeftTab = tab;
  document.querySelectorAll("#left-tabs .tab-btn").forEach(b => b.classList.toggle("active", b.dataset.ltab === tab));
  const isFilter = tab === "filter";
  if (isFilter && !filterModel.getValue().trim()) {
    filterAutoText = defaultFilterText();
    filterModel.setValue(filterAutoText);
  }
  yamlEditor.setModel(isFilter ? filterModel : yamlModel);
  document.getElementById("filter-tools").style.display = isFilter ? "" : "none";
}

async function applyFilterText() {
  let doc;
  try { doc = jsyaml.load(filterModel.getValue()); }
  catch (e) { return refreshFilterStatus("YAML: " + e.message); }
  if (typeof doc === "string") {
    // A packed .obfilter blob was pasted: unpack it into editable YAML first.
    try { doc = JSON.parse(await gunzipB64(doc)); }
    catch (e) { return refreshFilterStatus("not a filter blob: " + e.message); }
    if (doc.v !== 3) return refreshFilterStatus(`unsupported blob version ${doc.v} (expected 3)`);
    filterModel.setValue(picksToYaml(doc.picks, "# Unpacked from a .obfilter blob.", doc.until));
  }
  if (!doc || typeof doc !== "object" || Array.isArray(doc)) return refreshFilterStatus("need a top-level `picks:` mapping and/or `until: <stage>`");
  const until = doc.until ?? null;
  if (until !== null && typeof until !== "string") return refreshFilterStatus("until: must be a single stage id");
  const picks = doc.picks ?? null;
  if (picks === null && until === null) return refreshFilterStatus("need a top-level `picks:` mapping and/or `until: <stage>`");
  const err = picks === null ? null : validatePicks(picks);   // `until:` alone keeps every surviving stage
  if (err) return refreshFilterStatus(err);
  setActivePicks(picks, until);
}

// Mirrors omnibenchmark.filter.validate_picks.
function validatePicks(picks) {
  const isMap = v => v && typeof v === "object" && !Array.isArray(v);
  if (!isMap(picks)) return "need a top-level `picks:` mapping of stage → {module | '*': spec}";
  for (const [sid, mods] of Object.entries(picks)) {
    if (!isMap(mods)) return `picks.${sid}: must map module ids (or '*') to a spec`;
    if ("*" in mods && Object.keys(mods).length > 1) return `picks.${sid}: '*' cannot be mixed with explicit module ids`;
    for (const [mid, spec] of Object.entries(mods)) {
      if (spec === "all" || spec === "first") continue;
      if (Array.isArray(spec) && spec.every(h => typeof h === "string")) continue;
      return `picks.${sid}.${mid}: spec must be all, first, or a list of combo hashes (quote all-digit hashes)`;
    }
  }
  return null;
}

// Mirrors omnibenchmark.filter.module_spec: explicit module key wins, else the stage's '*'.
function expandPicks(picks) {
  const out = {};
  for (const st of benchStages) {
    const mods = picks[st.id];
    if (!mods) continue;
    const sp = {};
    for (const m of st.modules) {
      const spec = m.id in mods ? mods[m.id] : mods["*"];
      if (spec !== undefined) sp[m.id] = spec;
    }
    if (Object.keys(sp).length) out[st.id] = sp;
  }
  return out;
}

// Mirrors omnibenchmark.filter.find_orphans: picks that name nothing in the parent.
// `ob run --filter` refuses to run with these; here they become a status line.
function pickOrphans(picks) {
  const out = [];
  const byId = Object.fromEntries(benchStages.map(s => [s.id, s]));
  for (const [sid, mods] of Object.entries(picks)) {
    const st = byId[sid];
    if (!st) { out.push(`stage ${sid}`); continue; }
    for (const [mid, spec] of Object.entries(mods)) {
      const pool = mid === "*" ? st.modules : st.modules.filter(m => m.id === mid);
      if (!pool.length) { out.push(`module ${sid}/${mid}`); continue; }
      if (Array.isArray(spec)) {
        const have = new Set(pool.flatMap(m => (m.params || []).map(p => p.hash)));
        for (const h of spec) if (!have.has(h)) out.push(`combo ${sid}/${mid}/${h}`);
      }
    }
  }
  return out;
}

// With a message: show it as an error. Without: recompute orphans for the applied filter.
function refreshFilterStatus(errMsg) {
  const el = document.getElementById("filter-tools-status");
  let msg = errMsg || "";
  if (!errMsg && filterOn() && benchStages.length) {
    const o = pickOrphans(activePicks || {});
    if (activeUntil && !benchStages.some(s => s.id === activeUntil)) o.unshift(`until stage ${activeUntil}`);
    if (o.length) msg = `${o.length} pick${o.length === 1 ? "" : "s"} don't resolve (ob run would refuse): ${o.join(", ")}`;
  }
  el.textContent = msg;
  el.title = msg;
  el.classList.toggle("err", !!msg);
}

function yamlKey(id) { return /^[A-Za-z_][\w.-]*$/.test(id) ? id : JSON.stringify(id); }

// Starting point for a hand-written filter: every stage kept, with each module and
// its combo hashes listed as comments so nobody has to look hashes up elsewhere.
function defaultFilterText() {
  const lines = [
    "# Filter — same format as `ob run --filter picks.yaml`.",
    "#   <stage>: {'*': all}            every module in the stage",
    "#   <stage>: {<module>: all}       keep every parameter combo",
    "#                       first      first combo only",
    "#                       [h1, h2]   specific combos, by 8-char hash",
    "#   until: <stage>                 cut the expansion at that stage (+ what feeds it);",
    "#                                  stages inside the cut not listed in picks keep everything",
    "# A stage left out is pruned. Apply (Ctrl+Enter) subsets the views on the right.",
    "picks:",
  ];
  const MAX = 8;   // ponytail: combos listed per module; the rest is "+N more"
  for (const st of benchStages) {
    lines.push(`  ${yamlKey(st.id)}: {'*': all}`);
    for (const m of st.modules) {
      const ps = m.params || [];
      const combos = ps.slice(0, MAX).map(p => `${p.hash} (${p.cli})`).join(" · ");
      const more = ps.length > MAX ? ` · +${ps.length - MAX} more` : "";
      lines.push(`    # ${m.id}${combos ? ": " + combos + more : ""}`);
    }
  }
  if (!benchStages.length) lines.push("  # (no valid benchmark yet — this fills in once Check is green)");
  return lines.join("\n") + "\n";
}

function picksToYaml(picks, header, until) {
  const doc = until ? { until, picks } : { picks };
  return (header ? header + "\n" : "") + jsyaml.dump(doc, { flowLevel: 2, lineWidth: 120 });
}

// urlsafe-base64(gzip(json)) → json text, via the browser's native gzip.
async function gunzipB64(s) {
  s = s.trim().replace(/-/g, "+").replace(/_/g, "/");
  s += "=".repeat((4 - s.length % 4) % 4);
  const bytes = Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).text();
}

// ── Presets: a filters/ folder next to benchmark.yaml in the (trusted) source repo ──
async function loadFilterPresets(parsed) {
  const sel = document.getElementById("filter-preset");
  sel.innerHTML = '<option value="">presets…</option>';
  sel.disabled = true;
  if (!parsed) return;
  const dir = parsed.path.includes("/") ? parsed.path.replace(/\/[^/]*$/, "/") : "";
  const api = `https://api.github.com/repos/${parsed.org}/${parsed.repo}/contents/${dir}${FILTERS_DIR}?ref=${encodeURIComponent(parsed.ref)}`;
  try {
    const resp = await fetch(api);
    if (!resp.ok) return;              // no filters/ folder (404) or rate-limited: dropdown stays grey
    const items = (await resp.json()).filter(f => f.type === "file" && /^[^/]+\.(ya?ml|json|obfilter)$/i.test(f.name));
    for (const f of items) {
      const o = document.createElement("option");
      // Built from the trusted repo coordinates, not from the API's download_url.
      o.value = `https://raw.githubusercontent.com/${parsed.org}/${parsed.repo}/${parsed.ref}/${dir}${FILTERS_DIR}/${f.name}`;
      o.textContent = f.name;
      sel.appendChild(o);
    }
    sel.disabled = !items.length;
  } catch (e) { console.warn("filter presets:", e); }
}

async function loadPreset(e) {
  const url = e.target.value;
  if (!url) return;
  try {
    const resp = await fetch(url, { cache: "no-cache" });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    filterModel.setValue(await resp.text());
    setLeftTab("filter");
    applyFilterText();
  } catch (err) { refreshFilterStatus("preset: " + err.message); }
}

// ── Filtered tab (right): the outputs of the applied filter ──────────────────
function renderFilterResult() {
  const bodyEl = document.getElementById("filter-body");
  const hint = t => `<div style="color:var(--text-dim);font-size:12px;">${t}</div>`;
  if (!filterOn()) {
    bodyEl.innerHTML = hint("No filter applied. Write one in the <b>Filter</b> tab on the left (or pick a preset) and press Apply.");
    return;
  }
  const r = filterResult;
  if (!r) { bodyEl.innerHTML = hint("Generating filtered benchmark…"); return; }
  const effPicks = JSON.parse(r.eff_picks);      // picks after the `until` cut, as the blob carries them
  const ex = expandPicks(effPicks);
  const nStages = Object.keys(ex).length;
  const nMods   = Object.values(ex).reduce((a, sp) => a + Object.keys(sp).length, 0);
  let nCombos = 0;
  for (const st of benchStages) for (const m of st.modules) {
    const spec = (ex[st.id] || {})[m.id];
    if (spec === undefined) continue;
    const ps = m.params || [];
    nCombos += !ps.length ? 1 : spec === "all" ? ps.length : spec === "first" ? 1 : ps.filter(p => spec.includes(p.hash)).length;
  }
  const shortHash = (r.parent_hash || "").slice(0, 12);
  bodyEl.innerHTML = `
    <div class="result-section">
      <h3>Summary</h3>
      <div style="font-size:12px;color:var(--text-dim);">
        ${nStages} stage${nStages===1?"":"s"} · ${nMods} module${nMods===1?"":"s"} ·
        ${nCombos} param combo${nCombos===1?"":"s"} ·
        ${r.until ? 'until <code>' + escapeHtml(r.until) + '</code> · ' : ''}subset-of <code>sha256:${escapeHtml(shortHash)}…</code>
        ${r.parent_url ? '· provenance <code>' + escapeHtml(r.parent_url) + '</code>' : ''}
        ${loadedSourceUrl ? '· derived-from <code>' + escapeHtml(loadedSourceUrl) + '</code>' : ''}
      </div>
    </div>
    <div class="result-section">
      <h3>Filtered benchmark.yaml</h3>
      <pre id="filtered-yaml-out"></pre>
      <div class="result-actions">
        <button id="dl-yaml">Download benchmark.filtered.yaml</button>
        <button id="copy-yaml">Copy</button>
      </div>
    </div>
    <div class="result-section">
      <h3>Filter for <code>ob run --filter</code></h3>
      <textarea id="blob-packed-out" readonly rows="3"></textarea>
      <div class="result-actions">
        <button id="copy-blob">Copy blob</button>
        <button id="dl-blob">Download .obfilter</button>
        <button id="dl-picks">Download picks.yaml</button>
        <button id="toggle-json">Show JSON</button>
      </div>
      <pre id="blob-json-out" style="display:none;margin-top:6px;"></pre>
    </div>
  `;
  document.getElementById("filtered-yaml-out").textContent = r.filtered_yaml;
  document.getElementById("blob-packed-out").value = r.blob_packed;
  document.getElementById("blob-json-out").textContent = prettyJson(r.blob_json);
  document.getElementById("dl-yaml").onclick   = () => download("benchmark.filtered.yaml", r.filtered_yaml, "text/yaml");
  document.getElementById("copy-yaml").onclick = () => navigator.clipboard.writeText(r.filtered_yaml);
  document.getElementById("copy-blob").onclick = () => navigator.clipboard.writeText(r.blob_packed);
  document.getElementById("dl-blob").onclick   = () => download(`subset-${shortHash}.obfilter`, r.blob_packed, "application/octet-stream");
  document.getElementById("dl-picks").onclick  = () => download("picks.obfilter.yaml", picksToYaml(effPicks, "# ob run benchmark.yaml --filter picks.obfilter.yaml", r.until), "text/yaml");
  document.getElementById("toggle-json").onclick = (e) => {
    const el = document.getElementById("blob-json-out");
    const showing = el.style.display !== "none";
    el.style.display = showing ? "none" : "";
    e.target.textContent = showing ? "Show JSON" : "Hide JSON";
  };
}

function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function prettyJson(s) {
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch (_) { return s; }
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

// ── Divider drag ─────────────────────────────────────────────────────────────
(function setupDivider() {
  const divider = document.getElementById("divider");
  const editors = document.getElementById("editors");
  const leftPane = document.getElementById("yaml-pane");
  const rightPane = document.getElementById("snake-pane");
  let dragging = false;
  let startX, leftW, totalW;

  divider.addEventListener("mousedown", e => {
    dragging = true;
    startX = e.clientX;
    leftW = leftPane.getBoundingClientRect().width;
    totalW = editors.getBoundingClientRect().width - divider.offsetWidth;
    divider.classList.add("dragging");
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
  });

  document.addEventListener("mousemove", e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const newLeft = Math.max(200, Math.min(totalW - 200, leftW + dx));
    const pct = (newLeft / totalW) * 100;
    leftPane.style.flex = "none";
    leftPane.style.width = pct + "%";
    rightPane.style.flex = "1";
  });

  document.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    // trigger Monaco layout
    if (yamlEditor)  yamlEditor.layout();
    if (rightEditor) rightEditor.layout();
  });
})();
</script>
